<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>来宾登记</title>
<style>
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0;
  color:#56362f;
  background:#efe2cf;
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",Arial,sans-serif;
  background-image:
    radial-gradient(circle at 10% 8%,rgba(255,255,255,.85),transparent 26%),
    radial-gradient(circle at 90% 12%,rgba(139,20,27,.12),transparent 26%),
    linear-gradient(180deg,#f7eddf 0%,#ecd6c5 52%,#f4e7d6 100%);
}
a{text-decoration:none;color:inherit}
button,input,select,textarea{font:inherit}
.page{max-width:760px;margin:0 auto;padding:14px 12px 92px}
.topbar{
  display:flex;justify-content:space-between;align-items:center;gap:10px;
  padding:4px 2px 14px;
}
.music,.share{
  border:0;border-radius:999px;background:rgba(255,250,242,.88);
  box-shadow:0 8px 22px rgba(80,43,26,.12);
  color:#7c5148;
}
.music{padding:9px 14px;font-size:13px}
.share{width:42px;height:42px;color:#a12227}
.hero{
  overflow:hidden;border-radius:34px;border:1px solid rgba(255,255,255,.82);
  background:#fbf4e8;
  box-shadow:0 26px 85px rgba(88,50,31,.20);
}
.heroImg{
  display:block;width:100%;
  height:auto;
  background:#f5ead9;
}
.heroBody{
  margin-top:-2px;
  padding:24px 20px 26px;
  background:linear-gradient(180deg,rgba(255,248,238,.96),rgba(255,245,234,.92));
  text-align:center;
}
.en{
  font-family:Georgia,"Times New Roman",serif;
  font-size:42px;
  line-height:.95;
  font-style:italic;
  color:#911d22;
}
.cn{
  margin-top:10px;
  letter-spacing:.16em;
  font-size:16px;
  color:#6a453e;
}
.names{
  margin:18px auto 0;
  border:1px solid #e4c9aa;
  border-radius:999px;
  background:#fffdf7;
  padding:12px 14px;
  max-width:520px;
  color:#70433c;
  font-size:18px;
}
.names b{color:#9b2429}
.ctaRow{display:grid;gap:10px;margin-top:18px}
.btn{
  display:flex;align-items:center;justify-content:center;gap:8px;
  width:100%;
  border:0;border-radius:999px;
  background:#a92328;color:white;
  padding:15px 18px;
  font-weight:700;
  letter-spacing:.12em;
  box-shadow:0 14px 34px rgba(169,35,40,.28);
}
.btnLight{
  background:#fffaf0;
  color:#8e342f;
  border:1px solid #d7b98a;
  box-shadow:none;
}
.card{
  margin-top:16px;
  border:1px solid #e3c9aa;
  border-radius:28px;
  background:rgba(255,250,241,.92);
  box-shadow:0 18px 48px rgba(88,50,31,.13);
  padding:18px;
}
.title{
  margin:0;
  font-family:Georgia,"Songti SC",serif;
  color:#8d1f22;
  font-size:24px;
  letter-spacing:.12em;
  text-align:center;
}
.sub{font-size:13px;line-height:1.8;color:#856057}
.infoGrid{display:grid;gap:10px;margin-top:15px}
.info{
  display:flex;gap:12px;align-items:center;
  border:1px solid #ead7bd;
  border-radius:20px;
  background:#fffdf8;
  padding:13px;
}
.dot{
  width:42px;height:42px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  background:#a92328;color:#fff;font-weight:700;flex:0 0 auto;
  box-shadow:0 10px 20px rgba(169,35,40,.20);
}
.label{font-size:12px;color:#8b6659}
.value{margin-top:3px;font-size:15px;font-weight:650;line-height:1.45;color:#5e342f}
.videoBox{
  overflow:hidden;margin-top:14px;border:4px solid #fff;border-radius:22px;background:#111;
  box-shadow:0 16px 35px rgba(107,45,43,.18)
}
video{display:block;width:100%;background:#111}
.photos{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:14px}
.photo{background:#fff;padding:7px 7px 16px;border-radius:9px;box-shadow:0 12px 25px rgba(91,51,30,.16)}
.photo:nth-child(1){transform:rotate(-2deg)}.photo:nth-child(2){transform:rotate(2deg)}.photo:nth-child(3){transform:rotate(-3deg)}
.photo img{width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:4px}
.photo div{text-align:center;font-size:11px;color:#8b6659;margin-top:5px}
.form{display:grid;gap:13px;margin-top:16px}
.field label{display:block;margin-bottom:7px;font-size:13px;color:#8b6659}
input,select,textarea{
  width:100%;border:1px solid #eadbc5;background:#fffdf7;border-radius:999px;
  padding:13px 14px;outline:none;color:#5a352f;
}
textarea{border-radius:20px;min-height:92px;resize:vertical}
.msg{display:none;margin-top:10px;border-radius:16px;background:#fff1e3;padding:10px 12px;font-size:13px;color:#8d342f}
.footer{text-align:center;margin-top:24px;font-size:12px;color:#967266;letter-spacing:.1em}
.bottomCta{
  position:fixed;left:12px;right:12px;bottom:12px;z-index:30;max-width:740px;margin:auto;
  border:1px solid #e2c8aa;background:rgba(255,250,241,.95);border-radius:24px;
  box-shadow:0 16px 45px rgba(91,51,30,.22);backdrop-filter:blur(10px);padding:8px;
}
.bottomGrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.bottomGrid a{display:flex;align-items:center;justify-content:center;border-radius:18px;padding:12px 5px;font-size:13px;color:#7c564c}
.bottomGrid .red{background:#a92328;color:#fff;font-weight:700}
.adminPage{max-width:760px;margin:0 auto;padding:16px 12px 90px}
.statGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:12px}
.stat{border:1px solid #ead9c0;border-radius:18px;background:rgba(255,255,255,.6);padding:12px;text-align:center}
.stat b{display:block;font-size:22px;color:#8d1f22}
.guest{border:1px solid #ead9c0;border-radius:18px;background:rgba(255,255,255,.66);padding:13px;margin-top:10px}
.guestTop{display:flex;justify-content:space-between;gap:10px}
.smallBtn{border:0;border-radius:999px;background:#fff5e8;color:#a92328;padding:8px 10px;margin-left:5px}
@media(min-width:640px){
  .page{padding-top:18px}
  .ctaRow{grid-template-columns:1fr 1fr}
  .infoGrid{grid-template-columns:1fr 1fr}
  .form{grid-template-columns:1fr 1fr}
  .full{grid-column:1/-1}
}
</style>
</head>
<body>
<main class="page">
  <div class="topbar">
    <a class="music" href="index.html">← 返回邀请函</a>
    <span class="music">来宾登记</span>
  </div>

  <section class="card">
    <h1 class="title">来宾登记</h1>
    <p class="sub" style="text-align:center">请填写您的出席信息，方便我们安排席位与餐食。</p>

    <form class="form" onsubmit="submitGuest(event)">
      <div class="field"><label>姓名</label><input id="name" required placeholder="请输入姓名"></div>
      <div class="field"><label>性别</label><select id="gender"><option>先生</option><option>女士</option><option>小朋友</option></select></div>
      <div class="field"><label>联系电话</label><input id="phone" placeholder="方便婚礼前联系"></div>
      <div class="field"><label>来宾归属</label><select id="side"><option>新郎方</option><option>新娘方</option><option>共同好友</option><option>亲友</option></select></div>
      <div class="field"><label>是否出席</label><select id="attendance"><option>参加</option><option>待定</option><option>遗憾缺席</option></select></div>
      <div class="field"><label>出席人数</label><input id="guestCount" type="number" min="1" max="10" value="1"></div>
      <div class="field full"><label>忌口 / 饮食偏好</label><input id="dietary" placeholder="如：海鲜过敏、不吃辣、素食"></div>
      <div class="field full"><label>祝福留言 / 备注</label><textarea id="note" placeholder="想对新人说的话，也可以写在这里"></textarea></div>
      <div class="full"><button class="btn" type="submit">提交登记</button><div id="submitMsg" class="msg"></div></div>
    </form>
  </section>
</main>
<script>
var SUPABASE_URL = "__SUPABASE_URL__";
var SUPABASE_KEY = "__SUPABASE_ANON_KEY__";
var cloudMode = !!(SUPABASE_URL && SUPABASE_KEY);
function $(id){ return document.getElementById(id); }
function localGuests(){ try { return JSON.parse(localStorage.getItem('clean_sep_guests') || '[]'); } catch(e){ return []; } }
function saveLocal(list){ localStorage.setItem('clean_sep_guests', JSON.stringify(list)); }
function newId(){ return String(Date.now()) + String(Math.floor(Math.random()*10000)); }
function showMsg(t){ $('submitMsg').innerHTML=t; $('submitMsg').style.display='block'; }
function formData(){
  return {
    id:newId(), name:$('name').value, gender:$('gender').value, phone:$('phone').value,
    side:$('side').value, attendance:$('attendance').value, guest_count:Number($('guestCount').value||1),
    dietary:$('dietary').value, note:$('note').value, created_at:new Date().toISOString()
  };
}
function clearForm(){
  ['name','phone','dietary','note'].forEach(function(id){ $(id).value=''; });
  $('guestCount').value='1'; $('gender').value='先生'; $('side').value='新郎方'; $('attendance').value='参加';
}
function submitGuest(e){
  e.preventDefault();
  var data=formData();
  showMsg('提交中...');
  if(cloudMode && window.fetch){
    fetch(SUPABASE_URL + '/rest/v1/wedding_guests', {
      method:'POST',
      headers:{ 'apikey':SUPABASE_KEY, 'Authorization':'Bearer '+SUPABASE_KEY, 'Content-Type':'application/json', 'Prefer':'return=minimal' },
      body:JSON.stringify({name:data.name,gender:data.gender,phone:data.phone,side:data.side,attendance:data.attendance,guest_count:data.guest_count,dietary:data.dietary,note:data.note})
    }).then(function(r){
      if(!r.ok) throw new Error('提交失败');
      showMsg('登记成功，感谢您的祝福与到来。');
      clearForm();
    }).catch(function(){
      var list=localGuests(); list.unshift(data); saveLocal(list);
      showMsg('已登记成功。当前网络不稳定，信息已先保存在本机。');
      clearForm();
    });
  } else {
    var list=localGuests(); list.unshift(data); saveLocal(list);
    showMsg('登记成功，感谢您的祝福与到来。');
    clearForm();
  }
}
</script>
</body>
</html>
